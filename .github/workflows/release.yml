name: Release

on:
  release:
    types: [released]

permissions:
  contents: read

# One group for every release, not one per tag: two releases published close
# together both stamp .version and move a tag on main, and must not interleave.
concurrency:
  group: release

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # The formula is built and tested on a Mac from the same tree the release
  # will archive, before anything irreversible: a formula that does not
  # install, or a yo that still reports `dev`, stops the tag from moving.
  # The tarball is the job's own `git archive` of main, served over file://,
  # because the release's tarball does not exist yet; its contents are the
  # same tree minus the .version stamp, and the version brew splices comes
  # from the file name, as it does from the release URL.
  brew:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name }}
    outputs:
      sha: ${{ steps.tree.outputs.sha }}
    steps:
      - name: Refuse a tag that is not vMAJOR.MINOR.PATCH
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag '${TAG}' is not vMAJOR.MINOR.PATCH; refusing to build a formula from it"
              exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - id: tree
        name: Record the tree the formula is built from
        run: |
          set -euo pipefail
          # `release` checks this commit out, so the tree it stamps and
          # archives is the one brew installed and tested here, not whatever
          # main holds by the time that job starts.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install the formula from a local tarball and run its test
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tarball="$RUNNER_TEMP/yolobox-${version}.tar.gz"
          git archive --format=tar.gz --prefix="yolobox-${version}/" -o "$tarball" HEAD
          sha="$(shasum -a 256 "$tarball" | cut -d' ' -f1)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256 for $tarball"; exit 1; }
          # A local tap, because brew installs a formula by name from a tap,
          # not from a file path.
          brew tap-new --no-git local/yolobox
          formula="$(brew --repository local/yolobox)/Formula/yolobox.rb"
          sed -e "s#@URL@#file://${tarball}#" -e "s#@SHA256@#${sha}#" homebrew/yolobox.rb > "$formula"
          if grep -q '@[A-Z0-9_]*@' "$formula"; then
              echo "::error::the rendered formula still contains an unreplaced @HOLE@"
              exit 1
          fi
          brew install --build-from-source local/yolobox/yolobox
          brew test local/yolobox/yolobox
          test "$(yo --version)" = "yolobox ${version}"

  release:
    needs: [verify, brew]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    outputs:
      version: ${{ steps.build.outputs.version }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Refuse a tag that is not vMAJOR.MINOR.PATCH
        run: |
          set -euo pipefail
          # The version is spliced into the tarball name, the formula URL and
          # the tap commit message, so anything else is refused before a tag moves.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag '${TAG}' is not vMAJOR.MINOR.PATCH; refusing to release it"
              exit 1
          fi

      - name: Refuse before anything irreversible happens
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Read through the environment, never spliced into the script: an
          # expression inside `run:` is text substitution, which is how a
          # workflow injection starts.
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$REPO_PRIVATE" = "true" ]; then
              echo "::error::repository is private — every yo bootstrap fetches the flake ref anonymously and would break"
              exit 1
          fi
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
              echo "::error::HOMEBREW_TAP_TOKEN is empty — the brew half of this release would have nothing to push with"
              exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit brew built and tested, not main by name: one tree for
          # both jobs. The guard below checks main against it.
          ref: ${{ needs.brew.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse before the tag moves unless the tap token can push
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          # Checked now, not in bump-tap, because bump-tap runs after the tag has
          # moved. A dry-run push is the only probe that exercises the token's own
          # write grant: the REST permissions field reports the token owner's role,
          # which a fine-grained PAT does not share. The branch name is unique to
          # this run, so nothing is created. The token travels as an extra
          # header through git's environment config, never in the URL, where
          # it would sit in argv and in any error git prints. The checkout
          # above persisted its own GITHUB_TOKEN header in .git/config; the
          # empty value first resets that list, or git would send both.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 -w0)"
          if ! env GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0= \
              GIT_CONFIG_KEY_1=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_1=$header" \
              git push --dry-run https://github.com/aka-rider/homebrew-tap.git \
              "HEAD:refs/heads/preflight-probe-${GITHUB_RUN_ID}"; then
              echo "::error::HOMEBREW_TAP_TOKEN cannot push to aka-rider/homebrew-tap (git push --dry-run was refused, see above); refusing before the tag moves"
              exit 1
          fi

      - name: Assert the release tag is the tip of main
        run: |
          set -euo pipefail
          # HEAD is the tree brew built and tested. The next steps force-move
          # the tag onto a stamp of it, so main must still be at that tree and
          # the tag must name it. A tag cut from an older commit or another
          # branch, or a main that moved after brew tested it, would silently
          # republish different content under the same name, so refuse rather
          # than move it. The one other shape accepted is what this workflow's
          # own failed run leaves behind, the stamp pushed and the tag not yet
          # moved: a `release: <version> [skip ci]` commit that changes only
          # .version, directly on top of the tree. stamp_of says whether $1 is
          # such a stamp of $2.
          stamp_of() {
              [ "$(git rev-parse "$1^")" = "$2" ] \
                  && [ "$(git log -1 --format=%s "$1")" = "release: ${TAG#v} [skip ci]" ] \
                  && [ "$(git diff-tree --no-commit-id --name-only -r "$1")" = ".version" ]
          }
          git fetch --force --tags origin
          git fetch origin main
          built="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$main_sha" != "$built" ]; then
              if ! stamp_of "$main_sha" "$built"; then
                  echo "::error::main is at ${main_sha}, not the tree brew built and tested (${built}); refusing to release either"
                  exit 1
              fi
              # Our own stamp from the failed run: continue from it, so the
              # stamp step below is a no-op and the tag lands on it.
              git checkout -q "$main_sha"
          fi
          tag_sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" = "$head_sha" ] || stamp_of "$head_sha" "$tag_sha"; then
              exit 0
          fi
          echo "::error::${TAG} points at ${tag_sha}, not the tip of main (${head_sha}); refusing to move it"
          exit 1

      - name: Stamp .version from the tag and commit it
        run: |
          set -euo pipefail
          # The diff guard makes a re-run a no-op instead of a "nothing to
          # commit" failure. A push with GITHUB_TOKEN never triggers a workflow,
          # so [skip ci] changes nothing here; it is the subject the tip-of-main
          # guard above recognises, and the tap's commit carries it because
          # that push uses a PAT, which does trigger the tap's own workflows.
          printf '%s\n' "${TAG#v}" > .version
          if ! git diff --quiet -- .version; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "release: ${TAG#v} [skip ci]" -- .version
              git push origin HEAD:main
          fi

      - name: Move the tag onto the stamped commit
        run: |
          set -euo pipefail
          # Nix reads .version out of the tag's tree at fetch time, so the stamp
          # must be inside the tag. A tag push does not fire a release event, so
          # this does not loop.
          git tag -f "$TAG"
          git push --force origin "refs/tags/${TAG}"

      - id: build
        name: Build source tarball and hash it
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tarball="yolobox-${version}.tar.gz"
          git archive --format=tar.gz --prefix="yolobox-${version}/" -o "$tarball" HEAD
          # Checked before it is written: a sha256sum that printed nothing
          # would otherwise land an empty hash in the formula.
          sha="$(sha256sum "$tarball" | cut -d' ' -f1)"
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::sha256sum of ${tarball} gave '${sha}', not 64 hex digits"
              exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      - name: Upload the tarball to the published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          set -euo pipefail
          # upload, not create — a human already published the release.
          # --clobber keeps a re-run idempotent.
          gh release upload "$TAG" "$TARBALL" --clobber

  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: aka-rider/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render homebrew/yolobox.rb into the tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          url="https://github.com/aka-rider/yolobox/releases/download/v${VERSION}/yolobox-${VERSION}.tar.gz"
          mkdir -p homebrew-tap/Formula
          sed -e "s#@URL@#${url}#" -e "s#@SHA256@#${SHA256}#" homebrew/yolobox.rb > homebrew-tap/Formula/yolobox.rb
          # grep exits 1 for "no hole left", the good case; any other status is a real error.
          status=0
          grep -q '@[A-Z0-9_]*@' homebrew-tap/Formula/yolobox.rb || status=$?
          if [ "$status" -eq 0 ]; then
              echo "::error::Formula/yolobox.rb still contains an unreplaced @HOLE@"
              exit 1
          elif [ "$status" -ne 1 ]; then
              echo "::error::grep failed on Formula/yolobox.rb (exit ${status})"
              exit "$status"
          fi
          if [ -z "$(git -C homebrew-tap status --porcelain -- Formula/yolobox.rb)" ]; then
              echo "::error::Formula/yolobox.rb did not change; refusing to push a no-op commit"
              exit 1
          fi

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/yolobox.rb
          git commit -m "bump(yolobox): ${VERSION} [skip ci]"
          git push
