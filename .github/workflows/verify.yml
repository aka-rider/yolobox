name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check --output-format=github

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check

      - name: Smoke test — yo --help
        run: ./yo --help

      - name: Shellcheck the guest helper
        run: shellcheck -S warning nix/guest/yolobox-guest.sh nix/luks/yolobox-initrd-authorized-keys.sh nix/luks/yolobox-unlock.sh nix/luks/yolobox-luks-migrate.sh

  # 3.9 is the floor yo promises; the newest 3.x catches the other direction.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests

  # Evaluates the box's NixOS configuration without building it, so an
  # invalid option (v1.0.1 shipped `programs.git-lfs`) fails here instead of
  # on a user's `yo bootstrap`. Evaluation needs no aarch64 builder: the drv
  # path is computed, never realised, and IFD is disallowed to keep it so.
  eval:
    runs-on: ubuntu-latest
    env:
      # flake.nix throws without it; any non-empty name evaluates the same.
      YOLOBOX_USERNAME: ci
      # The opt-in kill switch. A box arms it with an exit node in
      # /etc/yolobox/local.nix, and then must name a resolver in
      # networking.nameservers too (the module asserts it). CI has no
      # local.nix, so this variant adds both as stand-ins.
      ARMED: |
        (builtins.getFlake "path:${builtins.getEnv "PWD"}").nixosConfigurations.yolobox.extendModules {
          modules = [ {
            yolobox.network.exitNode = "my-exit-node";
            networking.nameservers = [ "100.101.102.103" ];
          } ];
        }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: experimental-features = nix-command flakes

      # The default configuration, with no stand-in: it proves that a box
      # without /etc/yolobox/local.nix evaluates, with no kill switch.
      - name: Evaluate nixosConfigurations.yolobox
        run: >
          nix eval --impure --raw
          --option allow-import-from-derivation false
          .#nixosConfigurations.yolobox.config.system.build.toplevel.drvPath

      - name: Evaluate nixosConfigurations.yolobox with the kill switch
        run: >
          nix eval --impure --raw
          --option allow-import-from-derivation false
          --expr "($ARMED).config.system.build.toplevel.drvPath"

      # nix cannot check the kill switch's rule file (nft needs netlink, which
      # the build sandbox forbids), and a rule file that fails to load leaves
      # an opted-in box without the table. `nft --check` parses and validates it
      # against the runner's kernel without changing any rules.
      - name: Check the kill switch rules parse
        run: |
          rules="$(nix eval --impure --raw --expr "($ARMED).config.system.build.killswitchRules")"
          sudo apt-get install --yes nftables
          sudo nft --check --file "$rules"
