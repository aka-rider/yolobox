name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: check --output-format=github

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: format --check

      - name: Smoke test — yo --help
        run: ./yo --help

      - name: Shellcheck the guest helper
        run: shellcheck -S warning nix/guest/yolobox-guest.sh nix/luks/yolobox-initrd-authorized-keys.sh nix/luks/yolobox-unlock.sh nix/luks/yolobox-luks-migrate.sh nix/egress/yolobox-egress-load-tiers.sh nix/egress/yolobox-egress-failed.sh tests/render-tunnel-egress.sh tests/box-hardening-check.sh tests/box-hardening-e2e.sh linux/host-setup.sh tests/box-libvirt-check.sh

  # 3.9 is the floor yo promises; the newest 3.x catches the other direction.
  # The 3.9 leg is pinned to ubuntu-24.04 because setup-python has no 3.9 build
  # for ubuntu-latest's 26.04 image.
  # The official python:3.9 container is no substitute: it runs as root and
  # lacks jq and gawk, so tests fail or skip.
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests

  # Evaluates the box's NixOS configuration without building it, so an
  # invalid option (a name that is no NixOS option in any nixpkgs branch) fails
  # here instead of on a user's `yo bootstrap`. Evaluation needs no aarch64 builder: the drv
  # path is computed, never realised, and IFD is disallowed to keep it so.
  #
  # Two boxes are evaluated and every check below runs on each: the x86_64
  # guest (a Linux host's, or an Intel Mac's) and the aarch64 guest (an
  # Apple-silicon Mac's). The guest is never told its host OS, so the CPU is
  # the only axis a box varies on (nix/base.md, "No host OS in the guest").
  # The rule files are builtins.toFile, so they print without a builder on
  # either system.
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    env:
      # flake.nix throws without these two; any non-empty name and any valid
      # github:OWNER/REPO/REF evaluates the same.
      YOLOBOX_USERNAME: ci
      YOLOBOX_FLAKE_REF: github:aka-rider/yolobox/ci
      GUEST_SYSTEM: ${{ matrix.system }}
      # The guest system is the evaluating nix's own, so every evaluation goes
      # through this one command. It is not NIX_CONFIG: that would make the
      # job's own builds and runs target the guest's system too, and on the
      # aarch64 leg that binary cannot run on this x86_64 runner (the two
      # x86_64 legs would run it, so the mistake would show on one leg only).
      NIX_EVAL: nix eval --impure --system ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: experimental-features = nix-command flakes

      # The default configuration, with no stand-in: it proves a box without
      # /etc/yolobox/local.nix evaluates.
      - name: Evaluate nixosConfigurations.yolobox
        run: >
          $NIX_EVAL --raw
          --option allow-import-from-derivation false
          .#nixosConfigurations.yolobox.config.system.build.toplevel.drvPath

      # The ref is stamped into /etc/yolobox/flake-ref, and a rebuild without it
      # would delete the stamp, so the flake must refuse when it is unset, and
      # when it is not github:OWNER/REPO/REF. Each refusal must name the
      # variable, or it failed for some other reason. `! cmd` never fails a
      # `bash -e` step, hence the explicit exits.
      - name: Check the flake refuses a missing or non-github flake ref
        run: |
          attr=.#nixosConfigurations.yolobox.config.networking.hostName
          if env -u YOLOBOX_FLAKE_REF $NIX_EVAL --raw "$attr" 2> unset.err; then
            echo "evaluated with YOLOBOX_FLAKE_REF unset"; exit 1
          fi
          grep -F 'YOLOBOX_FLAKE_REF is' unset.err
          if env YOLOBOX_FLAKE_REF=path:/x $NIX_EVAL --raw "$attr" 2> path.err; then
            echo "evaluated with YOLOBOX_FLAKE_REF=path:/x"; exit 1
          fi
          grep -F 'YOLOBOX_FLAKE_REF is' path.err

      # A yo older than the flake still passes YOLOBOX_HOST_OS. The box must
      # be the same derivation whatever it says, or unset (nix/base.md).
      - name: Check the box ignores YOLOBOX_HOST_OS
        run: |
          attr=.#nixosConfigurations.yolobox.config.system.build.toplevel.drvPath
          unset_drv="$(env -u YOLOBOX_HOST_OS $NIX_EVAL --raw "$attr")"
          for value in darwin linux lizard; do
            test "$(env YOLOBOX_HOST_OS="$value" $NIX_EVAL --raw "$attr")" = "$unset_drv" ||
              { echo "YOLOBOX_HOST_OS=$value changed the box"; exit 1; }
          done

      # vz cannot emulate, so only an Apple-silicon Mac's guest has a rosetta
      # share to mount, and only that host runs an aarch64 guest; on any other
      # box it would wait on a mount that never comes (nix/base.md).
      - name: Check Rosetta is on exactly for the aarch64 guest
        run: |
          expected=false
          if [ "$GUEST_SYSTEM" = aarch64-linux ]; then
            expected=true
          fi
          test "$($NIX_EVAL --json .#nixosConfigurations.yolobox.config.virtualisation.rosetta.enable)" = "$expected"

      # The guest agent is enabled on every box and runs only where Lima's
      # cidata ships its binary. The script check catches a nixos-lima bump
      # that moves the binary away from the path the condition names.
      - name: Check lima-guestagent is gated on its binary
        run: |
          unit=.#nixosConfigurations.yolobox.config.systemd.services.lima-guestagent
          binary=/mnt/lima-cidata/lima-guestagent
          test "$($NIX_EVAL --json "$unit.enable")" = true
          test "$($NIX_EVAL --raw "$unit.unitConfig.ConditionPathExists")" = "$binary"
          $NIX_EVAL --raw "$unit.script" | grep -F "$binary daemon"

      # The agent holds a forwarded 1Password agent, which on a Linux host
      # serves the operator's key, so every box admits the operator only from
      # the gateway and drops that address off enp0s1 (nix/base.md). The
      # literals restate base.nix on purpose: this step only proves the two
      # rules are not conditional, i.e. present on both legs. What they do is
      # tests/box-hardening-check.sh's check_operator_login_refused.
      - name: Check the operator rules are on every box
        run: |
          box=.#nixosConfigurations.yolobox.config
          test "$($NIX_EVAL --json "$box.services.openssh.settings.AllowUsers")" = '["ci@192.168.5.2","agent"]'
          $NIX_EVAL --raw "$box.networking.firewall.extraCommands" |
            grep -F 'iptables -I nixos-fw 1 ! -i enp0s1 -s 192.168.5.2 -j DROP'

      # containersConf.settings is freeform toml, so a misspelled key
      # evaluates fine and silently sends container output back to the
      # journal (nix/podman.md).
      - name: Check container logs stay out of the journal
        run: |
          settings=.#nixosConfigurations.yolobox.config.virtualisation.containers.containersConf.settings
          test "$($NIX_EVAL --raw "$settings.containers.log_driver")" = k8s-file
          test "$($NIX_EVAL --raw "$settings.engine.events_logger")" = file

      # The module list and the sysctls are plain strings in the config, so a
      # dropped line would still evaluate. Pin the two that matter most
      # (nix/hardening.md).
      - name: Check the hardening settings are present
        run: |
          box=.#nixosConfigurations.yolobox.config
          test "$($NIX_EVAL --json "$box.boot.kernel.sysctl.\"kernel.io_uring_disabled\"")" = 2
          $NIX_EVAL --json "$box.boot.extraModprobeConfig" | grep -F 'install bluetooth '
          # The net/sched modules stay blocked and the default qdisc does not
          # (nix/hardening.md).
          for module in cls_u32 act_gact sch_netem; do
            $NIX_EVAL --json "$box.boot.extraModprobeConfig" | grep -F "install $module "
          done
          # `! cmd` never fails a `bash -e` step, hence the explicit exit.
          if $NIX_EVAL --json "$box.boot.extraModprobeConfig" | grep -F 'install sch_fq_codel '; then
            echo "sch_fq_codel, the default qdisc, is blocked"; exit 1
          fi

      # The kernel has no unprivileged_userns_clone, and systemd-sysctl warned
      # about the key on every boot (nix/base.md). A null value in the
      # attribute set is how it is removed, so read the rendered file.
      - name: Check no sysctl key the kernel lacks is rendered
        run: |
          $NIX_EVAL --raw \
            .#nixosConfigurations.yolobox.config.environment.etc \
            --apply 'etc: etc."sysctl.d/60-nixos.conf".text' > sysctl.conf
          grep -F kernel.yama.ptrace_scope sysctl.conf
          if grep -F unprivileged_userns_clone sysctl.conf; then exit 1; fi

      # yolobox.swapSizeMiB is how a box's local.nix sizes the swapfile
      # without mkForce (nix/base.md).
      - name: Check the swap size is an option
        run: |
          size() {
            $NIX_EVAL --json --expr "
              let
                box = (builtins.getFlake (toString ./.)).nixosConfigurations.yolobox.extendModules {
                  modules = [ { yolobox.swapSizeMiB = $1; } ];
                };
              in map (sw: sw.size) box.config.swapDevices
            "
          }
          default="$($NIX_EVAL --json .#nixosConfigurations.yolobox.options.yolobox.swapSizeMiB.default)"
          test "$($NIX_EVAL --json --apply 'map (sw: sw.size)' .#nixosConfigurations.yolobox.config.swapDevices)" = "[$default]"
          test "$(size 4096)" = '[4096]'
          test "$(size 0)" = '[]'

      # nix cannot check the egress rule files (nft needs netlink, which the
      # build sandbox forbids), and a rule file that fails to load leaves the
      # box in recovery mode with no network. `nft --check` parses and validates
      # each against the runner's kernel without changing any rules.
      - name: Check the egress rules parse
        run: |
          sudo apt-get update
          sudo apt-get install --yes nftables
          for rules in egressRules egressRecoveryRules egressLastResortRules; do
            file="$($NIX_EVAL --raw ".#nixosConfigurations.yolobox.config.system.build.$rules")"
            sudo nft --check --file "$file"
          done
          sudo nft --check --file "$(tests/render-tunnel-egress.sh --system "$GUEST_SYSTEM")"

      # The rendered files are what the kernel runs, so the egress tests read
      # them, not the Nix. The host has no nix, so the unit tests run on copies
      # in tests/fixtures; this step runs the same checker on the fresh render
      # and diffs the copies against it, so a fixture cannot drift. A diff
      # failure means: copy the fresh render over the fixture (nix/egress.md).
      - name: Check the egress rules close the host
        run: |
          rules="$($NIX_EVAL --raw .#nixosConfigurations.yolobox.config.system.build.egressRules)"
          recovery="$($NIX_EVAL --raw .#nixosConfigurations.yolobox.config.system.build.egressRecoveryRules)"
          lastresort="$($NIX_EVAL --raw .#nixosConfigurations.yolobox.config.system.build.egressLastResortRules)"
          tunnel="$(tests/render-tunnel-egress.sh --system "$GUEST_SYSTEM")"
          python3 tests/egress_rules.py "$rules" "$recovery" "$lastresort" "$tunnel"
          diff -u tests/fixtures/egress.nft "$rules"
          diff -u tests/fixtures/egress-recovery.nft "$recovery"
          diff -u tests/fixtures/egress-lastresort.nft "$lastresort"
          diff -u tests/fixtures/egress-tunnel.nft "$tunnel"

      # lanAllow goes into the rule files as text, so a bad entry must fail the
      # evaluation: nft would reject it at load and drop the box into recovery
      # mode. The assertions run on a configuration extended with one entry.
      - name: Check lanAllow rejects what nft would reject
        run: |
          check() {
            $NIX_EVAL --raw --expr "
              let
                box = (builtins.getFlake (toString ./.)).nixosConfigurations.yolobox.extendModules {
                  modules = [ { yolobox.network.lanAllow = [ \"$1\" ]; } ];
                };
              in
              if builtins.all (a: a.assertion) box.config.assertions then \"accepted\" else \"rejected\"
            "
          }
          for entry in 300.1.1.1/8 10.0.0.0/33 lizard fd00::/129 ::::/64 010.0.0.0/8; do
            test "$(check "$entry")" = rejected || { echo "not rejected: $entry"; exit 1; }
          done
          for entry in 192.168.1.20/32 fd00:1::/64; do
            test "$(check "$entry")" = accepted || { echo "not accepted: $entry"; exit 1; }
          done
