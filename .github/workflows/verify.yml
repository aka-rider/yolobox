name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check --output-format=github

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check

      - name: Smoke test — yo --help
        run: ./yo --help

      - name: Shellcheck the guest helper
        run: shellcheck -S warning nix/guest/yolobox-guest.sh

  # 3.9 is the floor yo promises; the newest 3.x catches the other direction.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests

  # Evaluates the box's NixOS configuration without building it, so an
  # invalid option (v1.0.1 shipped `programs.git-lfs`) fails here instead of
  # on a user's `yo bootstrap`. Evaluation needs no aarch64 builder: the drv
  # path is computed, never realised, and IFD is disallowed to keep it so.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: experimental-features = nix-command flakes

      - name: Evaluate nixosConfigurations.yolobox
        env:
          # flake.nix throws without it; any non-empty name evaluates the same.
          YOLOBOX_USERNAME: ci
        run: >
          nix eval --impure --raw
          --option allow-import-from-derivation false
          .#nixosConfigurations.yolobox.config.system.build.toplevel.drvPath
