name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: check --output-format=github

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: format --check

      - name: Smoke test — yo --help
        run: ./yo --help

      - name: Shellcheck the guest helper
        run: shellcheck -S warning nix/guest/yolobox-guest.sh nix/luks/yolobox-initrd-authorized-keys.sh nix/luks/yolobox-unlock.sh nix/luks/yolobox-luks-migrate.sh

  # 3.9 is the floor yo promises; the newest 3.x catches the other direction.
  # The 3.9 leg is pinned to ubuntu-24.04 because setup-python has no 3.9 build
  # for ubuntu-latest's 26.04 image (ubuntu-latest moved there on 2026-10-19).
  # The official python:3.9 container was tried instead and gives different
  # results: it runs as root and lacks jq and gawk, so tests fail or skip.
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests

  # Evaluates the box's NixOS configuration without building it, so an
  # invalid option (v1.0.1 shipped `programs.git-lfs`) fails here instead of
  # on a user's `yo bootstrap`. Evaluation needs no aarch64 builder: the drv
  # path is computed, never realised, and IFD is disallowed to keep it so.
  eval:
    runs-on: ubuntu-latest
    env:
      # flake.nix throws without it; any non-empty name evaluates the same.
      YOLOBOX_USERNAME: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: experimental-features = nix-command flakes

      # The default configuration, with no stand-in: it proves a box without
      # /etc/yolobox/local.nix evaluates.
      - name: Evaluate nixosConfigurations.yolobox
        run: >
          nix eval --impure --raw
          --option allow-import-from-derivation false
          .#nixosConfigurations.yolobox.config.system.build.toplevel.drvPath

      # containersConf.settings is freeform toml, so a misspelled key
      # evaluates fine and silently sends container output back to the
      # journal (nix/podman.md).
      - name: Check container logs stay out of the journal
        run: |
          settings=.#nixosConfigurations.yolobox.config.virtualisation.containers.containersConf.settings
          test "$(nix eval --impure --raw "$settings.containers.log_driver")" = k8s-file
          test "$(nix eval --impure --raw "$settings.engine.events_logger")" = file
