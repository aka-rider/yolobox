name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Smoke test — yo --help
        run: ./yo --help
