name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: check --output-format=github

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: format --check

      # The runner image's shellcheck is whatever the image ships; the pinned
      # shellcheck-py wheel carries one version, so a new image cannot change
      # which warnings fail the job.
      - name: Install the pinned shellcheck
        run: |
          python3 -m venv "$RUNNER_TEMP/shellcheck"
          "$RUNNER_TEMP/shellcheck/bin/pip" install shellcheck-py==0.11.0.1
          echo "$RUNNER_TEMP/shellcheck/bin" >> "$GITHUB_PATH"

      # No -S: the box builds most of these scripts with writeShellApplication,
      # whose check phase runs shellcheck at its default severity, so a finding
      # below `warning` that passes here fails the box build at `yo bootstrap`.
      - name: Shellcheck every tracked shell script
        run: shellcheck nix/guest/yolobox-guest.sh nix/harnesses/claude.sh nix/harnesses/yolobox-claude-launcher-keep.sh nix/harnesses/yolobox-claude-versions.sh nix/harnesses/yolobox-harness-install.sh nix/luks/yolobox-initrd-authorized-keys.sh nix/luks/yolobox-unlock.sh nix/luks/yolobox-luks-encrypt.sh nix/display/yolobox-screen-record.sh nix/display/yolobox-xvfb.sh tests/box-hardening-check.sh tests/box-hardening-e2e.sh linux/host-setup.sh linux/yolobox-libvirt-hook.sh tests/box-libvirt-check.sh

      # nix cannot check the rule file (nft needs netlink, which the build
      # sandbox forbids), and a file that fails to load leaves the box with no
      # network: dhcpcd requires the egress unit.
      - name: Check the egress rules parse
        run: |
          sudo apt-get update
          sudo apt-get install --yes nftables
          sudo nft --check --file nix/egress/yolobox-egress.nft

  # yo is stdlib Python, so the only axis is the Python version: 3.9 is the
  # floor yo promises, the newest 3.x catches the other direction. One runner,
  # ubuntu-24.04, because setup-python has no 3.9 build for 26.04.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      # Under the matrix interpreter, so the floor Python runs it too.
      - name: Smoke test — yo --help
        run: ./yo --help

      - name: Unit tests
        run: python -m unittest discover -s tests

  # Evaluates the box's NixOS configuration without building it, so an
  # invalid option (a name that is no NixOS option in any nixpkgs branch) fails
  # here instead of on a user's `yo bootstrap`. Evaluation needs no aarch64 builder: the drv
  # path is computed, never realised, and IFD is disallowed to keep it so.
  #
  # Two boxes are evaluated and every check below runs on each: the x86_64
  # guest (a Linux host's, or an Intel Mac's) and the aarch64 guest (an
  # Apple-silicon Mac's). The guest is never told its host OS, so the CPU is
  # the only axis a box varies on.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    env:
      # flake.nix throws without these two; any non-empty name and any valid
      # github:OWNER/REPO/REF evaluates the same.
      YOLOBOX_USERNAME: ci
      YOLOBOX_FLAKE_REF: github:aka-rider/yolobox/ci
      GUEST_SYSTEM: ${{ matrix.system }}
      # The guest system is the evaluating nix's own, so every evaluation goes
      # through this one command. It is not NIX_CONFIG: that would make the
      # job's own builds and runs target the guest's system too, and on the
      # aarch64 leg that binary cannot run on this x86_64 runner (the two
      # x86_64 legs would run it, so the mistake would show on one leg only).
      NIX_EVAL: nix eval --impure --system ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: experimental-features = nix-command flakes

      # The default configuration, with no stand-in: it proves a box without
      # /etc/yolobox/local.nix evaluates.
      - name: Evaluate nixosConfigurations.yolobox
        run: >
          $NIX_EVAL --raw
          --option allow-import-from-derivation false
          .#nixosConfigurations.yolobox.config.system.build.toplevel.drvPath

      # The ref is stamped into /etc/yolobox/flake-ref, and a rebuild without it
      # would delete the stamp, so the flake must refuse when it is unset. The
      # refusal must name the variable, or it failed for some other reason.
      # `! cmd` never fails a `bash -e` step, hence the explicit exit.
      - name: Check the flake refuses a missing flake ref
        run: |
          attr=.#nixosConfigurations.yolobox.config.networking.hostName
          if env -u YOLOBOX_FLAKE_REF $NIX_EVAL --raw "$attr" 2> unset.err; then
            echo "evaluated with YOLOBOX_FLAKE_REF unset"; exit 1
          fi
          grep -F 'YOLOBOX_FLAKE_REF is' unset.err

      # The operator account must not collide with the agent's or with root.
      # The refusal must name the variable, or it failed for some other reason.
      # The toplevel is evaluated because an assertion fires only when the
      # system is. `! cmd` never fails a `bash -e` step, hence the explicit
      # exits.
      - name: Check the flake refuses the agent's and root's name as the operator
        run: |
          attr=.#nixosConfigurations.yolobox.config.system.build.toplevel.drvPath
          for name in agent root; do
            if env YOLOBOX_USERNAME="$name" $NIX_EVAL --raw "$attr" 2> "$name.err"; then
              echo "evaluated with YOLOBOX_USERNAME=$name"; exit 1
            fi
            grep -F 'YOLOBOX_USERNAME is' "$name.err"
          done

      # The package is what `nix run github:aka-rider/yolobox/v<version>` runs,
      # and its one patch stamps .version over `YO_VERSION = "dev"` with
      # --replace-fail. Building it proves the patch
      # still matches, and the version it reports is .version's. Only the
      # x86_64 leg can run the binary it built.
      - name: Build yo and check the version it reports
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build .#yolobox
          ./result/bin/yo --version | grep -Fx "yolobox $(cat .version)"

      # Every script the box exposes as a system.build attribute (the guest
      # script, the display scripts, the harness scripts) is a
      # writeShellApplication package, whose check phase runs shellcheck at its
      # default severity inside the build. An evaluation never runs that phase,
      # so only a build proves the box's own shellcheck passes; the lint job
      # above runs the repo's pinned shellcheck at the same severity, and this
      # step holds nixpkgs' shellcheck to the same verdict. Only the x86_64 leg
      # can build.
      - name: Build the shellchecked script packages
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --impure --no-link \
            .#nixosConfigurations.yolobox.config.system.build.yoloboxGuestScript \
            .#nixosConfigurations.yolobox.config.system.build.yoloboxScreenRecord \
            .#nixosConfigurations.yolobox.config.system.build.yoloboxXvfb \
            .#nixosConfigurations.yolobox.config.system.build.yoloboxClaudeVersions \
            .#nixosConfigurations.yolobox.config.system.build.yoloboxClaudeLauncher \
            .#nixosConfigurations.yolobox.config.system.build.yoloboxClaudeLauncherKeep \
            .#nixosConfigurations.yolobox.config.system.build.yoloboxHarnessInstall

      # The guest trusts github.com through these pinned keys, so each must
      # be the key GitHub publishes.
      - name: Check the github.com host keys have the published fingerprints
        run: |
          $NIX_EVAL --json .#nixosConfigurations.yolobox.config.programs.ssh.knownHosts \
            | python3 -c 'import json, sys; [print(" ".join(h["hostNames"]), h["publicKey"]) for h in json.load(sys.stdin).values()]' \
            > known_hosts
          ssh-keygen -lf known_hosts | awk '{print $2, $3}' | sort > fingerprints
          printf '%s\n' \
            'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU github.com' \
            'SHA256:p2QAMXNIC1TJYWeIOttrVc98/R1BUFWu3/LiyKgUfQM github.com' \
            'SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s github.com' \
            | sort > published
          diff -u published fingerprints

      # vz cannot emulate, so only an Apple-silicon Mac's guest has a rosetta
      # share to mount, and only that host runs an aarch64 guest; on any other
      # box it would wait on a mount that never comes.
      - name: Check Rosetta is on exactly for the aarch64 guest
        run: |
          expected=false
          if [ "$GUEST_SYSTEM" = aarch64-linux ]; then
            expected=true
          fi
          test "$($NIX_EVAL --json .#nixosConfigurations.yolobox.config.virtualisation.rosetta.enable)" = "$expected"

      # The guest agent is enabled on every box and runs only where Lima's
      # cidata ships its binary. The script check catches a nixos-lima bump
      # that moves the binary away from the path the condition names.
      - name: Check lima-guestagent is gated on its binary
        run: |
          unit=.#nixosConfigurations.yolobox.config.systemd.services.lima-guestagent
          binary=/mnt/lima-cidata/lima-guestagent
          test "$($NIX_EVAL --json "$unit.enable")" = true
          test "$($NIX_EVAL --raw "$unit.unitConfig.ConditionPathExists")" = "$binary"
          $NIX_EVAL --raw "$unit.script" | grep -F "$binary daemon"

      # yo tells stage 2's sshd from the initrd's by the banner word alone, so
      # stage 2 must render it and the initrd's sshd, which copies a few of
      # stage 2's settings, must not. The gateway is exempt from per-source
      # penalties: every host connection comes from it.
      - name: Check the stage-2 banner mark and the gateway's penalty exemption
        run: |
          box=.#nixosConfigurations.yolobox.config
          test "$($NIX_EVAL --raw "$box.services.openssh.settings.VersionAddendum")" = yolobox-stage2
          test "$($NIX_EVAL --raw "$box.services.openssh.settings.PerSourcePenaltyExemptList")" = 192.168.5.2
          $NIX_EVAL --raw "$box.boot.initrd.systemd.contents.\"/etc/ssh/sshd_config\".text" > initrd-sshd.conf
          grep -F 'PerSourcePenalties no' initrd-sshd.conf
          if grep -F yolobox-stage2 initrd-sshd.conf; then
            echo "the initrd's sshd carries the stage-2 banner mark"; exit 1
          fi

      # The agent holds a forwarded 1Password agent, which on a Linux host
      # serves the operator's key, so every box admits the operator only from
      # the gateway and drops that address off enp0s1. The literals restate
      # base.nix on purpose: this step only proves the two rules are not
      # conditional, i.e. present on both legs.
      - name: Check the operator rules are on every box
        run: |
          box=.#nixosConfigurations.yolobox.config
          test "$($NIX_EVAL --json "$box.services.openssh.settings.AllowUsers")" = '["ci@192.168.5.2","agent@192.168.5.2"]'
          $NIX_EVAL --raw "$box.networking.firewall.extraCommands" |
            grep -F 'iptables -I nixos-fw 1 ! -i enp0s1 -s 192.168.5.2 -j DROP'

      # containersConf.settings is freeform toml, so a misspelled key
      # evaluates fine and silently sends container output back to the
      # journal.
      - name: Check container logs stay out of the journal
        run: |
          settings=.#nixosConfigurations.yolobox.config.virtualisation.containers.containersConf.settings
          test "$($NIX_EVAL --raw "$settings.containers.log_driver")" = k8s-file
          test "$($NIX_EVAL --raw "$settings.engine.events_logger")" = file

      # The module list and the sysctls are plain strings in the config, so a
      # dropped line would still evaluate. Pin the two that matter most.
      - name: Check the hardening settings are present
        run: |
          set -o pipefail
          box=.#nixosConfigurations.yolobox.config
          test "$($NIX_EVAL --json "$box.boot.kernel.sysctl.\"kernel.io_uring_disabled\"")" = 2
          $NIX_EVAL --json "$box.boot.extraModprobeConfig" | grep -F 'install bluetooth '
          # The net/sched modules stay blocked and the default qdisc does not.
          for module in cls_u32 act_gact sch_netem; do
            $NIX_EVAL --json "$box.boot.extraModprobeConfig" | grep -F "install $module "
          done
          # `! cmd` never fails a `bash -e` step, hence the explicit exit. The
          # config is read first: in an `if` condition a failing nix eval would
          # read as "not blocked", with or without pipefail.
          modprobe="$($NIX_EVAL --json "$box.boot.extraModprobeConfig")"
          if grep -F 'install sch_fq_codel ' <<<"$modprobe"; then
            echo "sch_fq_codel, the default qdisc, is blocked"; exit 1
          fi

      # The kernel has no unprivileged_userns_clone, and systemd-sysctl warned
      # about the key on every boot. A null value in the
      # attribute set is how it is removed, so read the rendered file.
      - name: Check no sysctl key the kernel lacks is rendered
        run: |
          $NIX_EVAL --raw \
            .#nixosConfigurations.yolobox.config.environment.etc \
            --apply 'etc: etc."sysctl.d/60-nixos.conf".text' > sysctl.conf
          grep -F kernel.yama.ptrace_scope sysctl.conf
          if grep -F unprivileged_userns_clone sysctl.conf; then exit 1; fi

      # yolobox.swapSizeMiB is how a box's local.nix sizes the swapfile
      # without mkForce.
      - name: Check the swap size is an option
        run: |
          size() {
            $NIX_EVAL --json --expr "
              let
                box = (builtins.getFlake (toString ./.)).nixosConfigurations.yolobox.extendModules {
                  modules = [ { yolobox.swapSizeMiB = $1; } ];
                };
              in map (sw: sw.size) box.config.swapDevices
            "
          }
          default="$($NIX_EVAL --json .#nixosConfigurations.yolobox.options.yolobox.swapSizeMiB.default)"
          test "$($NIX_EVAL --json --apply 'map (sw: sw.size)' .#nixosConfigurations.yolobox.config.swapDevices)" = "[$default]"
          test "$(size 4096)" = '[4096]'
          test "$(size 0)" = '[]'
          # The growth guard sits on the unit nixpkgs names for the file, and
          # 0 removes the old file.
          test "$($NIX_EVAL --json --apply 'units: units."mkswap-var-swapfile".serviceConfig ? ExecStartPre' .#nixosConfigurations.yolobox.config.systemd.services)" = true
          $NIX_EVAL --json --expr "
            let
              box = (builtins.getFlake (toString ./.)).nixosConfigurations.yolobox.extendModules {
                modules = [ { yolobox.swapSizeMiB = 0; } ];
              };
            in box.config.systemd.tmpfiles.rules
          " | grep -F '"r /var/swapfile"'
