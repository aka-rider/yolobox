# yolobox VM, derived from nixos-lima's nixos.yaml (v0.2.2)
images:
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.2.2/nixos-lima-v0.2.2-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha512:bfcb703cdbad28cfd27438dc009408a859f3c4f575d3598d9627ea712c66128e0fa015de2010ce42bb724abc49f45029a4fc81891fb1a04c567378a6fdf31903"

# Apple's Virtualization.framework; the rosetta block below only applies to vz.
vmType: vz

# Keep the Mac's HTTP(S)_PROXY out of the guest: a proxy the VM cannot reach
# would break every fetch the box makes.
propagateProxyEnv: false

mounts: []

memory: 16GiB
cpus: 8
disk: 100GiB

ssh:
  localPort: 60022
  # Lima would copy every ~/.ssh/*.pub into the guest's authorized keys. Only
  # the key lima itself generates may enter the box.
  loadDotSSHPubKeys: false
  # Lima picks vsock or TCP for 60022 once per start, when guest port 22 first
  # answers. The initrd sshd that unlocks the disk only speaks TCP, so the
  # choice must not depend on who answers first.
  overVsock: false

vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

portForwards:
  # Reverses the Mac's 1Password agent socket into the guest, so the VM
  # never carries any 1Password credential of its own.
  - guestSocket: "/run/yolobox-op/agent.sock"
    hostSocket: "{{.Home}}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
    reverse: true

  # Same shape, for the AWS broker: a VPN owning the Mac's default route
  # blackholes the guest's TCP path to 192.168.5.2 (gvproxy's NAT to host
  # loopback), so the broker is reached as a reversed unix socket instead of
  # a forwarded port, exactly like 1Password above.
  - guestSocket: "/run/yolobox-op/aws-broker.sock"
    hostSocket: "{{.Home}}/.local/state/yolobox/aws-broker.sock"
    reverse: true

  # Forward no guest UDP listener to the Mac. Lima mirrors every guest
  # listener onto the Mac's localhost, and nothing here needs a UDP one: the
  # secrets are unix sockets. The mirror only collides or intercepts.
  # tailscaled's UDP 41641 loses to the Mac's own Tailscale, which holds that
  # port ("failed to listen udp: 127.0.0.1:41641: address already in use"), and
  # port 68 would intercept the host's DHCP packets, which is an
  # issue with NixOS that other distros do not show
  # (https://github.com/nixos-lima/nixos-lima/issues/50).
  # Both guestIP lines are load-bearing. Lima skips an ignore rule for a
  # listener bound to 0.0.0.0 or :: unless the rule's guestIP is unspecified
  # too, and treats guestIP 0.0.0.0 as an exact match unless guestIPMustBeZero
  # is false. Without them the rule (default guestIP 127.0.0.1) matches only
  # loopback listeners. See lima/yolobox.md.
  - proto: udp
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    ignore: true

containerd:
  system: false
  user: false
