# yolobox VM, derived from nixos-lima's nixos.yaml (v0.2.1). This file is
# driver-agnostic: Lima resolves `images` to whichever entry matches the
# host arch and picks a driver (QEMU/KVM on Linux, vz or QEMU on macOS) on
# its own — nothing here names one. The `vmOpts.vz` block below is read
# only by Lima's own `_darwin.go` files and is never validated against the
# active driver, so it sits here inert, not conditional, on Linux.
#
# `user.uid` is pinned to 501 rather than left at Lima's default (the host
# user's own uid) because nix/base.nix, CONSTITUTION.md and CLAUDE.md all
# hard-code the operator at uid 501 and the agent at uid 1000 — on a Linux
# host, where `id -u` is typically 1000, leaving this unset would create
# the operator at the same uid CLAUDE.md's "Where things live" section
# already documents as an outage waiting to happen (see "Two accounts" in
# CLAUDE.md for the xiii/agent uid collision this is built to avoid).
user:
  uid: 501

images:
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.2.1/nixos-lima-v0.2.1-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha512:748c723b69dbdec40a9acaf78cc9070ae784dcb64b0856ab906efdac822d9abcc65565b8f8dfa4cf8b49cc6c12c372072e83bb5ed9247330a7c22675d9e141ce"

  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.2.1/nixos-lima-v0.2.1-x86_64.qcow2"
    arch: "x86_64"
    digest: "sha512:636c9c24d7aea340c808e72802cd05589d18c1bbeda45242e3c4725cdfdcc497cfdfd4dfecd76e4be7b8de3a688a1046f269c072bce487c0b06a60515262995e"

mounts: []

memory: 16GiB
cpus: 8
disk: 100GiB

ssh:
  localPort: 60022

vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

portForwards:
  # t3's web UI must be reachable from another Mac on the LAN. Lima's default
  # host side is 127.0.0.1 for every port, so publishing it takes an explicit
  # rule; t3 itself keeps binding 127.0.0.1 guest-side, and lima's forwarder
  # dials it from inside the guest, so the guest firewall is never traversed.
  - guestPort: 3773
    hostIP: "0.0.0.0"

  # Tell Lima's port-forwarding to ignore port 68 to prevent interception of host DHCP packets
  # Apparently this is an issue with NixOS that does not occur on other Linux distros
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true

containerd:
  system: false
  user: false
