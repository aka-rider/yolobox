# yolobox VM, derived from nixos-lima's nixos.yaml (v0.2.1)
images:
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.2.1/nixos-lima-v0.2.1-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha512:748c723b69dbdec40a9acaf78cc9070ae784dcb64b0856ab906efdac822d9abcc65565b8f8dfa4cf8b49cc6c12c372072e83bb5ed9247330a7c22675d9e141ce"

mounts: []

memory: 16GiB
cpus: 8
disk: 100GiB

ssh:
  localPort: 60022

vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

portForwards:
  # t3's web UI must be reachable from another Mac on the LAN. Lima's default
  # host side is 127.0.0.1 for every port, so publishing it takes an explicit
  # rule; t3 itself keeps binding 127.0.0.1 guest-side, and lima's forwarder
  # dials it from inside the guest, so the guest firewall is never traversed.
  - guestPort: 3773
    hostIP: "0.0.0.0"

  # Reverses the Mac's 1Password agent socket into the guest, so the VM
  # never carries any 1Password credential of its own.
  - guestSocket: "/run/yolobox-op/agent.sock"
    hostSocket: "{{.Home}}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
    reverse: true

  # Same shape, for the AWS broker: a VPN owning the Mac's default route
  # blackholes the guest's TCP path to 192.168.5.2 (gvproxy's NAT to host
  # loopback), so the broker is reached as a reversed unix socket instead of
  # a forwarded port, exactly like 1Password above.
  - guestSocket: "/run/yolobox-op/aws-broker.sock"
    hostSocket: "{{.Home}}/.local/state/yolobox/aws-broker.sock"
    reverse: true

  # Tell Lima's port-forwarding to ignore port 68 to prevent interception of host DHCP packets
  # Apparently this is an issue with NixOS that does not occur on other Linux distros
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true

containerd:
  system: false
  user: false
